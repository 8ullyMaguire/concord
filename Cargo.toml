[workspace]
resolver = "2"
members = [
    # The estate crates, vendored (ADR 0013): they lived in unversioned sibling directories until 2026-11-15, which is why a
    # clean clone could not compile and CI had never been green. Verbatim copies, checked with `diff -r` at the time of the move.
    "vendor/polaris-core",
    "vendor/polaris-healthz",
    "vendor/polaris-authz",
    "vendor/polaris-ledger",
    "vendor/polaris-ratelimit",
    "vendor/polaris-slug",
    "vendor/polaris-comments",
    "crates/embed",
    "crates/domain",
    "crates/ranking",
    "crates/governance",
    "crates/finder",
    "crates/scout",
    "crates/db",
    "crates/app",
    "crates/web",
    "crates/parity",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
repository = "https://git.polarisocial.xyz/concord/concord"

[workspace.dependencies]
concord-embed = { path = "crates/embed" }
concord-finder = { path = "crates/finder" }
concord-scout = { path = "crates/scout" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The estate crates, vendored under vendor/ (ADR 0013). They were path dependencies on sibling directories outside this
# repository until 2026-11-15: seven unversioned crates, 4,052 lines, existing on one host. A clean clone could not compile —
# which is the failure CI had been reporting since 2026-11-14 without anyone reading it as that.
polaris-core = { path = "vendor/polaris-core" }
polaris-healthz = { path = "vendor/polaris-healthz" }
polaris-authz = { path = "vendor/polaris-authz" }
polaris-ledger = { path = "vendor/polaris-ledger" }
polaris-ratelimit = { path = "vendor/polaris-ratelimit" }
polaris-slug = { path = "vendor/polaris-slug" }
polaris-comments = { path = "vendor/polaris-comments" }
