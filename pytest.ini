[pytest]
# Suite discovery, stated rather than assumed.
#
# `python3 -m pytest tests/e2e` collected 35 tests and called it a pass. The
# Finder suite's 38 were never collected, because `finder_e2e.py` matches
# neither of pytest's default patterns (test_*.py, *_test.py). A green run that
# silently skipped an entire suite is worse than a red one, so the filenames are
# listed here -- and a test asserts this configuration is what actually runs.
#
# The first fix listed the filenames here by hand and a test asserted the list was
# what actually ran. It went stale a SECOND time, on the next five suites:
# feature_e2e.py, requests_e2e.py, lists_e2e.py, board_e2e.py and settings_e2e.py
# were all missing, so a directory-level run collected 152 of 210 tests across 8 of
# 13 files and reported a pass. The gate that existed for exactly this named four
# files and a total floor of 88 -- both stayed true while five suites stopped
# running. A list maintained by hand goes stale the same way the thing it guards
# does.
#
# So the NAME is the registration: a suite is `*_e2e.py`, and that pattern is what
# collects it. The two files that do not follow the convention are named, and they
# are the only two.
testpaths = tests/e2e
python_files = *_e2e.py e2e_test.py harness_selftest_test.py
