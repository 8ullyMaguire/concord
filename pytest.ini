[pytest]
# Suite discovery, stated rather than assumed.
#
# `python3 -m pytest tests/e2e` collected 35 tests and called it a pass. The
# Finder suite's 38 were never collected, because `finder_e2e.py` matches
# neither of pytest's default patterns (test_*.py, *_test.py). A green run that
# silently skipped an entire suite is worse than a red one, so the filenames are
# listed here -- and a test asserts this configuration is what actually runs.
#
# EVERY *_e2e.py FILE BELONGS HERE. This list went stale once already:
# scout_e2e.py, consensus_e2e.py and feeds_e2e.py were all run by an explicit
# path in the Makefile while matching none of these patterns, so a bare
# `pytest tests/e2e` silently collected 35 of the suite's tests and reported a
# pass. A file that runs only when someone remembers to name it does not run.
testpaths = tests/e2e
python_files = e2e_test.py finder_e2e.py project_panels_e2e.py harness_selftest_test.py scout_e2e.py consensus_e2e.py feeds_e2e.py audit_e2e.py