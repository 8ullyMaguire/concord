[pytest]
# Suite discovery, stated rather than assumed.
#
# `python3 -m pytest tests/e2e` collected 35 tests and called it a pass. The
# Finder suite's 38 were never collected, because `finder_e2e.py` matches
# neither of pytest's default patterns (test_*.py, *_test.py). A green run that
# silently skipped an entire suite is worse than a red one, so the filenames are
# listed here -- and a test asserts this configuration is what actually runs.
testpaths = tests/e2e
python_files = e2e_test.py finder_e2e.py harness_selftest_test.py