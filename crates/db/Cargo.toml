[package]
name = "concord-db"
description = "Concord db: PostgreSQL access: the baseline schema's row types and the store functions the web layer calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
argon2 = "0.5"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "rt"] }
ulid.workspace = true

[dependencies]
concord-finder = { workspace = true }
concord-embed.workspace = true
concord-governance = { path = "../governance" }
concord-ranking = { path = "../ranking" }
# The estate owns the thread rules and the permission decision (ADR 0011; the plan's own S4 `Adopt:` line).
# `crates/db/src/comments.rs` used to carry a body check, an order, and a tombstone of its own; gate 19 fails a
# site for that, and gate 45 for the role ladder in `moderation.rs`.
polaris-comments = { path = "../../../../polaris-comments" }
polaris-authz = { path = "../../../../polaris-authz" }
anyhow.workspace = true
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
ulid.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
