[package]
name = "polaris-ledger"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "The rules an audit log and its public projection must keep, without owning anyone's table"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
