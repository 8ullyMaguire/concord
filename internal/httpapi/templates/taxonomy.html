{{define "content"}}
<div class="page-head">
  <div>
    <p class="breadcrumb"><a href="/">Home</a> / <span>Taxonomy</span></p>
    <h1>Taxonomy</h1>
    <p class="lede">The labels everything is filed under, across every project. A
      change here is <strong>proposed, not made</strong>: it applies when enough
      eligible taggers have consented, so that one person cannot rename the thing
      everybody else is using.</p>
  </div>
</div>

<!--
  aria-busy until the first render, like every other fetched page: the skeleton is
  on screen while the two reads are in flight, and a reader who is told "no tags
  yet" before the tags arrive has been told something false.
-->
<div id="taxonomy-root" aria-busy="true">
<script src="{{ asset "/assets/js/skeleton.js" }}"></script>
<script>
(function(){var b=document.getElementById("taxonomy-root");
if(b&&window.ConcordSkeleton){b.innerHTML=window.ConcordSkeleton.rows(4);}})();
</script>
  <div class="empty-state">
    <p class="empty-state-title">Loading&hellip;</p>
  </div>
</div>

<!-- Consent and proposal outcomes land here rather than inside a list that is about
     to be re-read: a ratified change replaces the proposal row, and a message
     rendered into that row would disappear with it. -->
<div id="taxonomy-live" role="status" aria-live="polite" data-taxonomy-live></div>

<script src="{{ asset "/assets/js/taxonomy.js" }}"></script>
{{end}}
