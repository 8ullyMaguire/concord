{{define "content"}}
<div class="page-head">
  <div>
    <p class="breadcrumb"><a href="/projects">Projects</a> / <a href="/projects/{{.Slug}}">{{.Slug}}</a> / <span>Feature</span></p>
    <h1>Feature &middot; <span data-slug>{{.Slug}}</span></h1>
    <p class="lede">The unit the ranking sorts on. Impact against effort, with the
      uncertainty shown rather than hidden &mdash; a new feature with no votes yet is
      <em>unsure</em>, not <em>low</em>.</p>
  </div>
</div>

<div id="feature-root" aria-busy="true">

(function(){var b=document.getElementById("feature-root");
if(b&&window.ConcordSkeleton){b.innerHTML=window.ConcordSkeleton.rows(4);}})();
</script>

  <div class="empty-state">
    <p class="empty-state-title">Loading the feature&hellip;</p>
  </div>
</div>

<script src="{{ asset "/assets/js/feature.js" }}"></script>
{{end}}
