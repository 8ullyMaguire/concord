name: gate

# Review decision 7: until now every gate in this repository was run by hand, from memory, on one host, in an order the operator chose
# that day. A gate that depends on somebody remembering is a gate that is skipped on the day it matters.
on:
  push:
    # Explicit branch names, not `"**"`. The glob form was in the file for every push this repository has received since
    # 2026-11-14 and produced exactly one run (20:30 that day) while the repository's own push events kept arriving --
    # `repos/:owner/:repo/events` lists PushEvents on `port-rust` on 2026-11-13, 14 and 15. Naming the branches is the
    # cheapest thing that can be wrong, and it is measurable: if a push creates a run after this change, the glob was it.
    branches: [port-rust, master, main]
  pull_request:
  # Manual dispatch is not decoration: the only run this workflow has ever had (2026-11-14, `70890ab`) failed at the toolchain
  # step with `failed to load manifest for workspace member crates/db`, and 30+ pushes since then produced no run at all. Without
  # this trigger there is no way to ask GitHub "does the gate still run here?" without inventing a commit to push.
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord
          POSTGRES_DB: concord
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://concord:concord@127.0.0.1:5432/concord
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The page probe (`scripts/parity/probe_fixture.py`) seeds a fixture through the e2e harness, and the harness
      # speaks libpq from Python. Without this the gate fails at "the page fixture could not be seeded" with
      # `ModuleNotFoundError: No module named 'psycopg2'` — a missing dependency read as a missing feature.
      - name: python dependencies
        run: python -m pip install --quiet "psycopg2-binary>=2.9"
      # `mkfifo`/`psql` are preinstalled on the runner image; nothing else is needed because the gate shells out to the same commands a
      # person runs by hand. The point of CI here is not to invent a second gate, it is to run the one gate where nobody can skip it.
      - name: gate
        run: |
          chmod +x scripts/gate.sh
          scripts/gate.sh
